services:
  db:
    image: postgres:17
    container_name: postgres_upload_csv

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: upload_csv

    ports:
      - "5433:5432"

    volumes:
      - postgres_upload_csv_data:/var/lib/postgresql/data

volumes:
  postgres_upload_csv_data: